#REQUIRED: Modbus transaction function code (see www.modbus.org specifications).
#    fnct_01_read_coils               (01 = 0x01) (new in 1.1)
#    fnct_02_read_discrete_inputs     (02 = 0x02)
#    fnct_03_read_holding_registers   (03 = 0x03)
#    fnct_04_read_input_registers     (04 = 0x04)
#    fnct_05_write_single_coil        (05 = 0x05) (new in 1.1)
#    fnct_06_write_single_register    (06 = 0x06)
#    fnct_15_write_multiple_coils     (15 = 0x0F)
#    fnct_16_write_multiple_registers (16 = 0x10)
#
# Created pins:
# fnct_01_read_coils:
# fnct_02_read_discrete_inputs:
#     mb2hal.m.n.bit     (output)
#     mb2hal.m.n.bit-inv (output)
# fnct_03_read_holding_registers:
# fnct_04_read_input_registers:
#     mb2hal.m.n.float   (output)
#     mb2hal.m.n.int     (output)
# fnct_05_write_single_coil:
#     mb2hal.m.n.bit     (input)
#         NELEMENTS needs to be 1 or PIN_NAMES must contain just one name.
# fnct_06_write_single_register:
#     mb2hal.m.n.float   (input)
#     mb2hal.m.n.int     (input)
#     NELEMENTS needs to be 1 or PIN_NAMES must contain just one name.
#     Both pin values are added and limited to 65535 (UINT16_MAX). Normally use one and let the other open (read as 0).
# fnct_15_write_multiple_coils:
#     mb2hal.m.n.bit     (input)
# fnct_16_write_multiple_registers:
#     mb2hal.m.n.float   (input)
#     mb2hal.m.n.int     (input)
#     Both pin values are added and limited to 65535 (UINT16_MAX). Normally use one and let the other open (read as 0).

# ++++++++++++++++++++++++
# Common section
# ++++++++++++++++++++++++
[MB2HAL_INIT]

#OPTIONAL: Debug level of init and INI file parsing.
# 0 = silent.
# 1 = error messages (default).
# 2 = OK confirmation messages.
# 3 = debugging messages.
# 4 = maximum debugging messages (only in transactions).
INIT_DEBUG=1
#SLOWDOWN=3 

VERSION=1.1

#OPTIONAL: HAL module (component) name. Defaults to "mb2hal".
# mb = Modbus
HAL_MODULE_NAME=mb2hal
SLOWDOWN=0.0

#REQUIRED: The number of total Modbus transactions. There is no maximum.
TOTAL_TRANSACTIONS=20

[TRANSACTION_00]
LINK_TYPE=tcp
TCP_IP=192.168.3.2
TCP_PORT=502
MB_SLAVE_ID=1

FIRST_ELEMENT=0
MB_TX_CODE=fnct_02_read_discrete_inputs

HAL_TX_NAME=cab.in

#NELEMENTS=12
PIN_NAMES=\
VF12-SPINDLE_OK,\
ILK.2-AP190-Y_RES_OK,\
ILK.1-AP163-DC_BKRS_OK,\
ILK.3-AP195-ILK_LOOP_OK,\
AR17-TOOL_ROT_DISABLED,\
PNL.VB13-CLEAR_SW,\
AG113.AUX_CRT_ON,\
AS18.INVERTER_IDLE,\
TEMP.SB11-SLT_B_TEMP_OK,\
RESERVED1,\
PNL.AR13-KEY,\
TEMP.SA11-SLT_A_TEMP_OK


#DEBUG=2


[TRANSACTION_01]
FIRST_ELEMENT=0
MB_TX_CODE=fnct_15_write_multiple_coils

HAL_TX_NAME=cab.out

#NELEMENTS=20
PIN_NAMES=\
AG144-CA13.BORING_CONTACTOR,\
AG144-SA13.SPINDLE_CONTACTOR,\
AS16-AS15.INVERTER_EN_CMD,\
RESERVED2,\
AG113-AP12.MACHINE_POWER,\
RESERVED3

#DEBUG=2

[TRANSACTION_02]
# Operating Area PLC
LINK_TYPE=tcp
TCP_IP=192.168.3.3 
TCP_PORT=502
MB_SLAVE_ID=1

FIRST_ELEMENT=0
MB_TX_CODE=fnct_02_read_discrete_inputs

# Operating Area . Input
HAL_TX_NAME=opr.i

#NELEMENTS=16
PIN_NAMES=\
SA123-TOOL-REL-BUTTON,\
RESERVED2,\
SA111-TOOL-UNLOCKED-A,\
SA112-TOOL-LCKD-PRSNT,\
RESERVED5,\
RESERVED6,\
RESERVED7,\
RESERVED8,\
RESERVED9,\
RESERVED10,\
RESERVED11,\
RESERVED12,\
RESERVED13,\
RESERVED14,\
RESERVED15,\
RESERVED16


[TRANSACTION_03]
FIRST_ELEMENT=0
MB_TX_CODE=fnct_15_write_multiple_coils

# Operating Area . Output
HAL_TX_NAME=opr.o

#NELEMENTS=16
PIN_NAMES=\
SU11-SPINDLE-AIR-PURGE,\
SA114-SPINDLE-HOLD-TOOL,\
SA115-SPINDLE-RELEASE-TOOL,\
RESERVED4,\
VC11-OIL-LEVEL,\
VC12-LUBE-OVER,\
RESERVED7,\
RESERVED8,\
RESERVED9,\
RESERVED10,\
RESERVED11,\
RESERVED12,\
RESERVED13,\
RESERVED14,\
RESERVED15,\
RESERVED16



# mb2hal.ini for Yaskawa VS-616G5 VFD as Spindle via Modbus RTU

# Register (hex),       Function,                   Bit No.,    Description
# 001                   Operational Signals,        0,          Forward operation
# 001                   Operational Signals,        1,          Reverse Operation Terminal 3
# 001                   Operational Signals,        2,          Closed External Terminal 4
# 001                   Operational Signals,        3,          Closed External Terminal 5
# 001                   Operational Signals,        4,          Closed External Terminal 6
# 001                   Operational Signals,        5,          Closed External Terminal 7
# 001                   Operational Signals,        6,          Closed External Terminal 8
#
# 002                   Frequency Reference,        0-3,        1 Hz / 100 (4)
#
# 003                   Frequency Reference / ,     4,          (Not specified; returns value for frequency reference/output frequency)
#
# 004                   Not supported,              -,          Will return zeros
#
# 005                   Not supported,              -,          Will return zeros
#
# 006                   Analog Output 1 Setting,    -,          -10V / 60 to +10V / 660 analog output on terminals 21 & 22 (5)
#
# 007                   Analog Output 2 Setting,    -,          -10V / 60 to +10V / 660 analog output on terminals 23 & 25 (6)
#
# 008                   Contact Output Setting,     0,          "Multi-function Contact Output (terminals 25 & 27): ""closed"" (2)"
# 008                   Contact Output Setting,     1,          "Multi-function Contact Output (terminals 26 & 27): ""closed"" (4)"
# 008                   Contact Output Setting,     2,          Not used
# 008                   Contact Output Setting,     3,          Not used
# 008                   Contact Output Setting,     4,          Not used
# 008                   Contact Output Setting,     5,          Fault not used
# 008                   Contact Output Setting,     6,          Fault Contact state effective only when bit 7 = 1
# 008                   Contact Output Setting,     7,          Fault Contact return all zeros

# 00A-00F,              Reserved,                   -,          Reserved (return all zeros)



# 0x001: Operational Signals / Control Signals
[TRANSACTION_04]
LINK_TYPE=serial
SERIAL_PORT=/dev/ttyUSB0
SERIAL_BAUD=4800
SERIAL_BITS=8
SERIAL_PARITY=even
SERIAL_STOP=1

MB_SLAVE_ID=1 

# 0x001 = 1
FIRST_ELEMENT=1
NELEMENTS=1
MB_TX_CODE=fnct_16_write_multiple_registers 

# Small delay for serial stability
SERIAL_DELAY_MS=100 
MB_RESPONSE_TIMEOUT_MS=200
MB_BYTE_TIMEOUT_MS=200

HAL_TX_NAME=spin.control-word
MAX_UPDATE_RATE=10.0  


# 0x001: Operational Signals / Control Signals - READ
[TRANSACTION_05]
# 0x001 = 1
FIRST_ELEMENT=1
NELEMENTS=1
MB_TX_CODE=fnct_03_read_holding_registers
HAL_TX_NAME=spin.control-word-read
MAX_UPDATE_RATE=10.0 
DEBUG=1


# 0x002: Frequency Reference 
[TRANSACTION_06]
# 0x002 = 2
FIRST_ELEMENT=2
NELEMENTS=1
MB_TX_CODE=fnct_16_write_multiple_registers 
HAL_TX_NAME=spin.freq-ref
MAX_UPDATE_RATE=10.0 


# 0x010: Status Signals
[TRANSACTION_07]
# 0x10 = 16
FIRST_ELEMENT=16 
NELEMENTS=1
MB_TX_CODE=fnct_03_read_holding_registers
HAL_TX_NAME=spin.status-word
MAX_UPDATE_RATE=20.0

# 0x011: Drive Fault Contents
[TRANSACTION_08]
# 0x11 = 17
FIRST_ELEMENT=17
NELEMENTS=1
MB_TX_CODE=fnct_03_read_holding_registers
HAL_TX_NAME=spin.0x011.drive-fault
MAX_UPDATE_RATE=20.0

# 0x012: OPE Error Codes
[TRANSACTION_09]
# 0x12 = 18
FIRST_ELEMENT=18
NELEMENTS=1
MB_TX_CODE=fnct_03_read_holding_registers
HAL_TX_NAME=spin.0x012.ope-err
MAX_UPDATE_RATE=20.0

# 0x014: Fault Content 1
[TRANSACTION_10]
# 0x14 = 20
FIRST_ELEMENT=20
NELEMENTS=1
MB_TX_CODE=fnct_03_read_holding_registers
HAL_TX_NAME=spin.0x014.flt-cnt1
MAX_UPDATE_RATE=20.0

# 0x015: Fault Content 2
[TRANSACTION_11]
# 0x15 = 21
FIRST_ELEMENT=21
NELEMENTS=1
MB_TX_CODE=fnct_03_read_holding_registers
HAL_TX_NAME=spin.0x015.flt-cnt2
MAX_UPDATE_RATE=20.0

# 0x016: Fault Content 3
[TRANSACTION_12]
# 0x16 = 22
FIRST_ELEMENT=22
NELEMENTS=1
MB_TX_CODE=fnct_03_read_holding_registers
HAL_TX_NAME=spin.0x016.flt-cnt3
MAX_UPDATE_RATE=20.0

# 0x017: CPF Content 1
[TRANSACTION_13]
# 0x17 = 23
FIRST_ELEMENT=23
NELEMENTS=1
MB_TX_CODE=fnct_03_read_holding_registers
HAL_TX_NAME=spin.0x017.cpf-cnt1
MAX_UPDATE_RATE=20.0

# 0x018: CPF Content 2
[TRANSACTION_14]
# 0x18 = 24
FIRST_ELEMENT=24
NELEMENTS=1
MB_TX_CODE=fnct_03_read_holding_registers
HAL_TX_NAME=spin.0x018.cpf-cnt2
MAX_UPDATE_RATE=20.0

# 0x019: Minor Fault Content 1
[TRANSACTION_15]
# 0x19 = 25
FIRST_ELEMENT=25
NELEMENTS=1
MB_TX_CODE=fnct_03_read_holding_registers
HAL_TX_NAME=spin.0x019.min-flt1
MAX_UPDATE_RATE=20.0

# 0x01A: Minor Fault Content 2
[TRANSACTION_16]
# 0x1A = 26
FIRST_ELEMENT=26
NELEMENTS=1
MB_TX_CODE=fnct_03_read_holding_registers
HAL_TX_NAME=spin.0x01A.min-flt2
MAX_UPDATE_RATE=20.0

# 0x020: Frequeny Reference - READ
[TRANSACTION_17]
# 0x20 = 32
FIRST_ELEMENT=32
NELEMENTS=1
MB_TX_CODE=fnct_03_read_holding_registers
HAL_TX_NAME=spin.0x032.freq-ref
MAX_UPDATE_RATE=20.0

# 0x021 = Output Frequency
[TRANSACTION_18]
# 0x21 = 33
FIRST_ELEMENT=33 
NELEMENTS=1
MB_TX_CODE=fnct_03_read_holding_registers
HAL_TX_NAME=spin.0x021.output-freq
MAX_UPDATE_RATE=10.0

# 0x029 = Input Terminal Status
[TRANSACTION_19]
# 0x29 = 41 
FIRST_ELEMENT=41 
NELEMENTS=1
MB_TX_CODE=fnct_03_read_holding_registers
HAL_TX_NAME=spin.0x029.input-terms
MAX_UPDATE_RATE=10.0
